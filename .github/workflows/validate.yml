name: Validate GeoJSON

# Validate every .geojson file in the repo on each push and pull request, so
# malformed or non-conformant GeoJSON can't merge to main.

on:
  pull_request:
  push:
    branches: [main]

  # Allow manual runs from the Actions tab
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  validate:
    name: Validate GeoJSON files
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc

      - name: Validate all .geojson files
        run: ./scripts/validate.sh
